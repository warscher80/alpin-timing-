<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ALPIN TIMING — Admin / Freischaltung</title>
<style>
  :root{--bg:#080b0f;--panel:#10161d;--line:#1d2730;--ink:#e8eef2;--dim:#9aa8b4;--dimmer:#74828d;
    --green:#00e58a;--green-dim:#0a7a4d;--cyan:#22d3ee;--amber:#ffb020;--red:#ff4d4d;
    --mono:ui-monospace,'SF Mono',Consolas,monospace;--sans:system-ui,'Segoe UI',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1000px 500px at 80% -10%,#0e2a24 0%,transparent 55%),var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;min-height:100vh;padding:24px 18px 60px}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-size:22px;letter-spacing:.04em;margin-bottom:4px}
  h1 span{color:var(--green)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#121a22,#0c1117);padding:16px 18px;margin-bottom:16px}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  input{background:#0a0f15;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:14px}
  input:focus{outline:none;border-color:var(--green)}
  button{font-family:var(--sans);cursor:pointer;border:none;border-radius:9px;font-weight:600;padding:9px 13px;font-size:13px;background:#1a242e;color:var(--ink);border:1px solid var(--line)}
  button:hover{background:#212d39;border-color:#2c3a47}
  button.primary{background:linear-gradient(180deg,#13c479,#0a9d5f);color:#03130c;border:none}
  button.warn{color:var(--amber);border-color:#3a2f12}
  button.sm{padding:6px 10px;font-size:12px}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);text-align:left;padding:8px 8px;font-weight:600;border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
  .u{font-family:var(--mono);font-weight:700;color:var(--cyan)}
  .badge{font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:20px;white-space:nowrap}
  .b-owner{color:#04130d;background:var(--green)}
  .b-ok{color:var(--green);border:1px solid var(--green-dim)}
  .b-no{color:var(--amber);border:1px solid #3a2f12}
  .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .msg{margin-top:10px;font-size:13px;min-height:18px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .hint{color:var(--dimmer);font-size:12px;margin-top:8px;line-height:1.5}
  code{font-family:var(--mono);color:var(--cyan);background:#0a0f15;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ALPIN&nbsp;TIMING <span>ADMIN</span></h1>
  <div class="sub">Kunden freischalten &amp; Lizenzen verwalten. Nur für dich (Betreiber).</div>

  <div class="card">
    <div class="row">
      <div style="flex:1;min-width:220px"><label>Admin-Schlüssel</label>
        <input id="key" type="password" placeholder="ADMIN_KEY (aus Render)" style="width:100%"></div>
      <button class="primary" id="load">Konten laden</button>
    </div>
    <div class="hint">Der Schlüssel ist die Umgebungsvariable <code>ADMIN_KEY</code>, die du bei Render gesetzt hast. Er wird nur lokal in diesem Browser gemerkt.</div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <label>Manuell freischalten (nach Zahlung)</label>
    <div class="row">
      <div><label style="text-transform:none;letter-spacing:0;color:var(--dimmer)">Benutzername</label><input id="gu" placeholder="verein-xy"></div>
      <div><label style="text-transform:none;letter-spacing:0;color:var(--dimmer)">Tage</label><input id="gd" type="number" value="365" style="width:100px"></div>
      <button class="primary" id="grant">Freischalten</button>
    </div>
  </div>

  <div class="card">
    <label>Konten (<span id="cnt">–</span>)</label>
    <div style="overflow:auto"><table id="tbl"><thead><tr><th>Benutzer</th><th>Erstellt</th><th>Status</th><th style="text-align:right">Aktion</th></tr></thead><tbody id="tb"><tr><td colspan="4" style="color:var(--dimmer)">— „Konten laden" klicken —</td></tr></tbody></table></div>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const KEYLS="alpin_admin_key";
try{ const k=localStorage.getItem(KEYLS); if(k) $('key').value=k; }catch(e){}
function msg(t,ok){ const m=$('msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); }
function hdr(){ return {'Content-Type':'application/json','x-admin-key':$('key').value}; }
function fmtDate(ms){ if(!ms) return '–'; try{ return new Date(ms).toLocaleDateString('de-AT'); }catch(e){ return '–'; } }
async function load(){
  try{ localStorage.setItem(KEYLS,$('key').value); }catch(e){}
  msg('lädt …',true);
  try{
    const r=await fetch('/api/admin/list',{headers:hdr()});
    if(r.status===403){ msg('Falscher Admin-Schlüssel (oder ADMIN_KEY am Server nicht gesetzt).',false); return; }
    const d=await r.json(); render(d.users||[]); $('cnt').textContent=d.count||0; msg((d.count||0)+' Konten geladen.',true);
  }catch(e){ msg('Fehler: '+e.message,false); }
}
function render(list){
  const tb=$('tb');
  if(!list.length){ tb.innerHTML='<tr><td colspan="4" style="color:var(--dimmer)">Noch keine Konten.</td></tr>'; return; }
  tb.innerHTML=list.map(u=>{
    let badge = u.owner ? '<span class="badge b-owner">🔑 Inhaber</span>'
      : u.licensed ? '<span class="badge b-ok">✓ Lizenz bis '+fmtDate(u.exp)+'</span>'
      : '<span class="badge b-no">🔒 keine Lizenz</span>';
    const acts = u.owner ? '<span style="color:var(--dimmer);font-size:12px">dauerhaft</span>'
      : '<div class="acts"><button class="sm primary" data-g="'+u.user+'" data-d="365">1 Jahr</button>'
        +'<button class="sm" data-g="'+u.user+'" data-d="30">30 Tage</button>'
        +'<button class="sm warn" data-r="'+u.user+'">Entziehen</button></div>';
    return '<tr><td class="u">'+esc(u.user)+'</td><td style="color:var(--dim)">'+fmtDate(u.created)+'</td><td>'+badge+'</td><td>'+acts+'</td></tr>';
  }).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function grant(user,days){
  try{ const r=await fetch('/api/admin/grant',{method:'POST',headers:hdr(),body:JSON.stringify({username:user,days:days})});
    const d=await r.json(); if(!r.ok){ msg(d.msg||d.error||'Fehler',false); return; }
    msg(user+' freigeschaltet.',true); load(); }catch(e){ msg('Fehler: '+e.message,false); }
}
async function revoke(user){
  if(!confirm('Lizenz von '+user+' entziehen?')) return;
  try{ const r=await fetch('/api/admin/revoke',{method:'POST',headers:hdr(),body:JSON.stringify({username:user})});
    const d=await r.json(); if(!r.ok){ msg(d.msg||d.error||'Fehler',false); return; }
    msg(user+' entzogen.',true); load(); }catch(e){ msg('Fehler: '+e.message,false); }
}
$('load').onclick=load;
$('grant').onclick=()=>{ const u=$('gu').value.trim(); if(!u){ msg('Benutzername eingeben',false); return; } grant(u,parseInt($('gd').value)||365); };
$('tb').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.g) grant(b.dataset.g, parseInt(b.dataset.d)||365);
  else if(b.dataset.r) revoke(b.dataset.r); });
$('key').addEventListener('keydown',e=>{ if(e.key==='Enter') load(); });
</script>
</body>
</html>
